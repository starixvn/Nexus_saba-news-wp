version: '3'

services:
  wp:
    build: .
    container_name: bet12-wp
    restart: always
    ports:
       - "8000:80"
    volumes:
      - ./wp-config.DEV.php:/var/www/html/wp-config.php
      - ./wp-includes/js:/var/www/html/wp-includes/js
      - ./wp-admin:/var/www/html/wp-admin  # Mount the local WordPress files
      - ./wp-content/themes/smart-mag:/var/www/html/wp-content/themes/smart-mag
      - ./wp-content/themes/SABA-Sports-ID:/var/www/html/wp-content/themes/SABA-Sports-ID
      - ./bvg:/var/www/html/bvg