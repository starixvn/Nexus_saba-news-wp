map $http_accept $webp_suffix {
  default "";
  "~*webp" ".webp";
}
server {
    listen 80;
    listen 7519;
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.18.200.124;
    set_real_ip_from 10.18.200.125;
    access_log  /var/log/nginx/nexus_wp_upload.access.log;
    error_log  /var/log/nginx/nexus_wp_upload.error.log;
    root /usr/share/nginx;
    index index.html;
        # issue with ip and the nginx proxy
    location / {
        try_files $uri $uri/ =404;
    }
	location ~* ^.+\.(png|jpe?g|gif)$ {
		add_header Vary Accept;
		try_files $uri$webp_suffix $uri =404;
	}
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|css|js|webp)$ {
            expires 12M;
            access_log off;
            add_header Cache-Control "public";
        }
    location /whoami {
        default_type text/plain;
                    return 200 "SITE: nexus_wp_upload\nSERVER IP: Physical IP - 10.18.200.138 | Container IP - $server_addr\nSERVER FWD IP: $proxy_add_x_forwarded_for\nPUBLIC PORT: 7519\nProxy PORT: 80\nProject Path: ./app/uploads";
                }

}
