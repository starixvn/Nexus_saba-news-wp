version: '3.3'
services:
  wordpress:
    container_name: wp_saba-reports
    image: registry.nexdev.net:5050/nexcel/nexus/saba-sports/saba-new-wp
    volumes:
      - /var/www/gluster/volume1/nexus/wp/saba_upload/app/uploads:/var/www/html/wp-content/uploads/
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.wordpress == yes
    restart: always
    logging:
      driver: fluentd
      options:
        tag: docker.saba-reports.wordpress
        fluentd-async-connect: 'true'
    networks:
      - swarm_nexcel_local
      - private

networks:
  swarm_nexcel_local:
    external: true
  private:
    external: true
