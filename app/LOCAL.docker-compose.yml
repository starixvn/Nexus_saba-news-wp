version: '3.3'
services:
  saba_news_wp_LOCAL:
    image: registry.nexdev.net:5050/nexcel/nexus/saba-sports/saba-new-wp
    volumes:
      - /var/www/gluster/volume1/nexus/wp/saba_upload/app/uploads:/var/www/html/wp-content/uploads/
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.NEXCEL == yes
    networks:
      - swarm_nexcel_local
      - private

networks:
  swarm_nexcel_local:
    external: true
  private:
    external: true
